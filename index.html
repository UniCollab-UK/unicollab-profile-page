<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>UniCollab · Digital CV</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #f2f2f7; color: #111111; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  .wrap { max-width: 760px; margin: 0 auto; padding: 0 0 64px; }

  .topbar { display: flex; align-items: center; justify-content: space-between; padding: 20px 24px; border-bottom: 1px solid #e6e6ec; background: #fff; }
  .brand { display: flex; align-items: center; gap: 8px; }
  .brand img { width: 26px; height: 26px; }
  .brand-word { font-size: 17px; font-weight: 800; letter-spacing: -0.3px; }
  .brand-uni { color: #b2caff; }
  .brand-collab { color: #1E2761; }
  .kicker { font-size: 10.5px; font-weight: 800; letter-spacing: 0.8px; text-transform: uppercase; color: #aaa; }

  .content { padding: 28px 24px 0; }

  .hero { display: flex; align-items: center; gap: 18px; }
  .avatar { width: 76px; height: 76px; border-radius: 38px; flex-shrink: 0; object-fit: cover; background: #dceeff; }
  .avatar-fallback { width: 76px; height: 76px; border-radius: 38px; flex-shrink: 0; background: #1E2761; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 26px; font-weight: 800; }
  .name { font-size: 25px; font-weight: 800; letter-spacing: -0.4px; margin: 0 0 4px; }
  .meta { font-size: 14px; color: #666; margin: 0; }
  .uni { font-size: 13.5px; color: #1a6ec7; font-weight: 700; margin-top: 4px; }

  .meta-grid { display: flex; flex-wrap: wrap; gap: 24px; margin-top: 16px; padding-top: 16px; border-top: 1px solid #e6e6ec; }
  .meta-item-label { font-size: 10.5px; font-weight: 800; letter-spacing: 0.5px; text-transform: uppercase; color: #aaa; margin-bottom: 3px; }
  .meta-item-value { font-size: 13.5px; font-weight: 700; color: #333; }

  .cta-card { background: #1E2761; border-radius: 16px; padding: 22px; margin-top: 16px; text-align: center; }
  .cta-title { font-size: 16px; font-weight: 800; color: #fff; margin: 0 0 6px; }
  .cta-sub { font-size: 13px; color: rgba(255,255,255,0.7); margin: 0 0 16px; line-height: 1.5; }
  .cta-btn { display: inline-block; background: #fff; color: #1E2761; font-size: 13.5px; font-weight: 800; padding: 11px 22px; border-radius: 100px; text-decoration: none; }

  .card-soft { background: #eef0f5; border-radius: 16px; padding: 18px 20px; margin-top: 24px; font-size: 14.5px; line-height: 1.6; color: #333; white-space: pre-wrap; }

  .goal-card { background: #1E2761; border-radius: 16px; padding: 18px 20px; margin-top: 16px; }
  .goal-kicker { font-size: 10.5px; font-weight: 800; letter-spacing: 0.8px; text-transform: uppercase; color: rgba(255,255,255,0.6); margin-bottom: 6px; }
  .goal-role { font-size: 18px; font-weight: 800; color: #fff; }

  .section { margin-top: 32px; }
  .section-label { font-size: 11px; font-weight: 800; letter-spacing: 0.8px; text-transform: uppercase; color: #999; margin-bottom: 12px; border-bottom: 1px solid #e6e6ec; padding-bottom: 10px; }
  .pills { display: flex; flex-wrap: wrap; gap: 7px; }
  .pill { background: #eef2ff; color: #1E2761; font-size: 12.5px; font-weight: 700; padding: 6px 12px; border-radius: 100px; }

  .links-table { border: 1px solid #e6e6ec; border-radius: 14px; overflow: hidden; background: #fff; }
  .links-row { display: flex; align-items: center; padding: 12px 16px; font-size: 13.5px; }
  .links-row + .links-row { border-top: 1px solid #f0f0f4; }
  .links-label { color: #888; width: 120px; flex-shrink: 0; font-weight: 600; }
  .links-value { color: #1a6ec7; font-weight: 700; text-decoration: none; word-break: break-word; }

  .card { background: #fff; border: 1px solid #e0dfd8; border-radius: 16px; padding: 18px; margin-bottom: 12px; }
  .card-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
  .card-title { font-size: 15.5px; font-weight: 700; margin: 0; }
  .card-body { font-size: 13.5px; color: #666; line-height: 1.55; margin: 8px 0 10px; white-space: pre-wrap; }
  .badge { display: inline-block; font-size: 10px; font-weight: 800; letter-spacing: 0.4px; text-transform: uppercase; padding: 4px 10px; border-radius: 100px; flex-shrink: 0; white-space: nowrap; }
  .badge-active { background: #dceeff; color: #1a6ec7; }
  .badge-completed { background: #d4f5e2; color: #2d9c55; }

  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
  .piece { background: #fff; border: 1px solid #e0dfd8; border-radius: 16px; overflow: hidden; }
  .piece img { width: 100%; aspect-ratio: 1; object-fit: cover; display: block; background: #e8e8e8; }
  .piece-body { padding: 10px 12px; }
  .piece-title { font-size: 13px; font-weight: 700; margin: 0 0 3px; line-height: 1.3; }
  .piece-sub { font-size: 11.5px; color: #888; margin: 0; white-space: pre-wrap; }

  .empty { font-size: 13.5px; color: #aaa; }
  .footer { margin-top: 48px; text-align: center; font-size: 12px; color: #bbb; padding: 0 24px; }
  .state { padding: 80px 24px; text-align: center; font-size: 14.5px; color: #999; }
  @media (max-width: 420px) {
    .links-label { width: 96px; }
  }
</style>
</head>

  <div class="wrap">
    <div class="content" id="app">
      <div class="state" id="state">Loading…</div>
    </div>
  </div>

<script>
  var FUNCTION_URL = 'https://vqkhzpydmltzwtanvrkp.supabase.co/functions/v1/public-profile';

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function setState(msg) {
    var el = document.getElementById('state');
    if (el) el.textContent = msg;
  }

  function normalizeUrl(u) {
    return /^https?:\/\//i.test(u) ? u : ('https://' + u);
  }

  function formatMonthYear(iso) {
    if (!iso) return '';
    var d = new Date(iso);
    if (isNaN(d.getTime())) return '';
    var months = ['January','February','March','April','May','June','July','August','September','October','November','December'];
    return months[d.getMonth()] + ' ' + d.getFullYear();
  }

  function render(data) {
    var p = data.profile, portfolio = data.portfolio || [], projects = data.projects || [];
    document.title = p.name + ' · UniCollab';

    var initials = (p.name || '').trim().split(/\s+/).map(function (w) { return w[0]; }).join('').slice(0, 2).toUpperCase() || '?';
    var metaParts = [p.course, p.year].filter(Boolean).join(' · ');

    var heroHtml = ''
      + '<div class="hero">'
      + (p.avatarUrl
          ? '<img class="avatar" src="' + esc(p.avatarUrl) + '" alt="' + esc(p.name) + '">'
          : '<div class="avatar-fallback">' + esc(initials) + '</div>')
      + '<div>'
      + '<p class="name">' + esc(p.name) + '</p>'
      + (metaParts ? '<p class="meta">' + esc(metaParts) + '</p>' : '')
      + '</div></div>';

    var memberSince = formatMonthYear(p.memberSince);
    var metaItems = [];
    if (p.university) metaItems.push(['University', p.university]);
    if (memberSince) metaItems.push(['Member since', memberSince]);
    var metaGridHtml = metaItems.length
      ? '<div class="meta-grid">' + metaItems.map(function (item) {
          return '<div><div class="meta-item-label">' + esc(item[0]) + '</div><div class="meta-item-value">' + esc(item[1]) + '</div></div>';
        }).join('') + '</div>'
      : '';

    var bioHtml = p.bio ? '<div class="card-soft">' + esc(p.bio) + '</div>' : '';

    var firstName = (p.name || '').trim().split(/\s+/)[0] || 'this student';
    var ctaHtml = p.userId
      ? '<div class="cta-card"><p class="cta-title">Work with ' + esc(firstName) + '</p>'
        + '<p class="cta-sub">Message ' + esc(firstName) + ' on UniCollab to collaborate on a project.</p>'
        + '<a class="cta-btn" href="unicollab://profile/' + esc(p.userId) + '">Open in UniCollab</a></div>'
      : '';

    var goalHtml = (p.roles && p.roles.length)
      ? '<div class="goal-card"><div class="goal-kicker">Career goal</div><div class="goal-role">'
        + p.roles.map(esc).join(' · ') + '</div></div>'
      : '';

    var skillsHtml = (p.skills && p.skills.length)
      ? '<div class="section"><div class="section-label">Skills</div><div class="pills">'
        + p.skills.map(function (s) { return '<span class="pill">' + esc(s) + '</span>'; }).join('')
        + '</div></div>'
      : '';

    var validLinks = (p.links || []).filter(function (l) { return l && l.url; });
    var linksHtml = validLinks.length
      ? '<div class="section"><div class="section-label">Links</div><div class="links-table">'
        + validLinks.map(function (l) {
            var href = normalizeUrl(l.url);
            return '<div class="links-row"><span class="links-label">' + esc(l.label || 'Link') + '</span>'
              + '<a class="links-value" href="' + esc(href) + '" target="_blank" rel="noopener noreferrer">' + esc(l.url) + '</a></div>';
          }).join('')
        + '</div></div>'
      : '';

    var workHtml = '<div class="section"><div class="section-label">Work</div>'
      + (projects.length
          ? projects.map(function (proj) {
              var isCompleted = proj.status === 'completed';
              return '<div class="card">'
                + '<div class="card-top"><p class="card-title">' + esc(proj.title) + '</p>'
                + '<span class="badge ' + (isCompleted ? 'badge-completed' : 'badge-active') + '">' + (isCompleted ? 'Completed' : 'Active') + '</span></div>'
                + (proj.description ? '<p class="card-body">' + esc(proj.description) + '</p>' : '')
                + ((proj.skills && proj.skills.length)
                    ? '<div class="pills">' + proj.skills.map(function (s) { return '<span class="pill">' + esc(s) + '</span>'; }).join('') + '</div>'
                    : '')
                + '</div>';
            }).join('')
          : '<p class="empty">No posted projects yet.</p>')
      + '</div>';

    var portfolioHtml = '<div class="section"><div class="section-label">Portfolio</div>'
      + (portfolio.length
          ? '<div class="grid">' + portfolio.map(function (item) {
              var cover = (item.images || [])[0];
              return '<div class="piece">'
                + (cover ? '<img src="' + esc(cover) + '" alt="' + esc(item.title) + '">' : '<div style="aspect-ratio:1;background:#e8e8e8"></div>')
                + '<div class="piece-body">'
                + '<p class="piece-title">' + esc(item.title) + '</p>'
                + (item.subtitle ? '<p class="piece-sub">' + esc(item.subtitle) + '</p>' : '')
                + '</div></div>';
            }).join('') + '</div>'
          : '<p class="empty">No public portfolio pieces yet.</p>')
      + '</div>';

    document.getElementById('app').innerHTML = heroHtml + metaGridHtml + bioHtml + goalHtml + skillsHtml + workHtml + portfolioHtml + linksHtml + ctaHtml;
  }

  var userId = new URLSearchParams(location.search).get('u');
  if (!userId) {
    setState('Missing profile link — check the link and try again.');
  } else {
    fetch(FUNCTION_URL + '?u=' + encodeURIComponent(userId))
      .then(function (res) { return res.json().then(function (data) { return { ok: res.ok, data: data }; }); })
      .then(function (result) {
        if (!result.ok || !result.data || !result.data.success) {
          setState("This profile isn't available.");
          return;
        }
        render(result.data);
      })
      .catch(function () {
        setState("Couldn't load this profile — check your connection and try again.");
      });
  }
</script>
