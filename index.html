<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>UniCollab · Digital CV</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#1E2761;--navy-2:#15205a;--ink:#111;--ink-2:#4a4a4f;--ink-3:#8a8a96;--ice:#b8d4f8;--ice-bg:#eef4fd;--line:#e3e6ef;--paper:#f2f2f7;--green:#1F8A5B;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:var(--ink);background:var(--paper);line-height:1.6;}
a{color:var(--navy);text-decoration:none;}
a:hover{color:var(--navy-2);text-decoration:underline;}

.topbar{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);}
.topbar-in{max-width:1080px;margin:0 auto;padding:12px 24px;display:flex;align-items:center;justify-content:space-between;gap:16px;}
.brand{display:flex;align-items:center;gap:9px;}
.mark{height:32px;width:auto;display:block;}
.wordmark{font-size:16px;font-weight:800;letter-spacing:-.02em;color:var(--navy);}
.kicker{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);}
.top-actions{display:flex;align-items:center;gap:10px;}
.btn{font-family:inherit;font-size:14px;font-weight:600;padding:9px 20px;border-radius:999px;border:none;cursor:pointer;white-space:nowrap;}
.btn-primary{background:var(--navy);color:#fff;}
.btn-primary:hover{background:#2d3a8c;}
.btn-ghost{background:#fff;color:var(--navy);border:1.5px solid var(--line);}
.btn-ghost:hover{border-color:var(--ice);background:var(--ice-bg);}

.wrap{max-width:1080px;margin:0 auto;padding:28px 24px 64px;}
.hero{background:#fff;border-radius:18px;padding:32px;box-shadow:0 1px 3px rgba(30,39,97,.06);}
.hero-top{display:flex;gap:24px;align-items:flex-start;flex-wrap:wrap;}
.avatar{flex:none;width:104px;height:104px;border-radius:50%;background:linear-gradient(135deg,var(--navy),var(--navy-2));color:#fff;display:flex;align-items:center;justify-content:center;font-size:36px;font-weight:800;letter-spacing:-.02em;overflow:hidden;}
.avatar img{width:100%;height:100%;object-fit:cover;}
.who{flex:1;min-width:240px;}
.who h1{font-size:clamp(26px,4vw,34px);font-weight:800;letter-spacing:-.02em;line-height:1.15;margin-bottom:6px;}
.roleline{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:12px;}
.role{font-size:16px;font-weight:600;color:var(--navy);}
.verified{font-size:11.5px;font-weight:700;color:var(--navy);background:var(--ice-bg);padding:4px 11px;border-radius:999px;white-space:nowrap;}
.meta{display:flex;flex-wrap:wrap;gap:6px 22px;font-size:14px;color:var(--ink-2);}
.meta div strong{color:var(--ink-3);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.05em;display:block;}
.bio{margin-top:24px;padding-top:24px;border-top:1px solid var(--line);font-size:15.5px;color:var(--ink-2);max-width:72ch;white-space:pre-wrap;}
.goal{margin-top:20px;background:var(--navy);color:#fff;border-radius:14px;padding:20px 24px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px;}
.goal .lbl{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;opacity:.65;margin-bottom:3px;}
.goal .val{font-size:22px;font-weight:700;letter-spacing:-.01em;}
.goal .sub{font-size:13.5px;opacity:.85;max-width:44ch;}

.cols{display:grid;grid-template-columns:1fr 320px;gap:24px;margin-top:24px;align-items:start;}
@media (max-width:860px){.cols{grid-template-columns:1fr;}}
.card{background:#fff;border-radius:16px;padding:26px;box-shadow:0 1px 3px rgba(30,39,97,.06);}
.card + .card{margin-top:20px;}
h2{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--navy);margin-bottom:16px;}

.skill-group{margin-bottom:16px;}
.skill-group:last-child{margin-bottom:0;}
.gl{font-size:12.5px;font-weight:700;color:var(--ink-3);margin-bottom:7px;}
.chips{display:flex;flex-wrap:wrap;gap:7px;}
.chip{font-size:13px;font-weight:600;color:var(--navy);background:var(--ice-bg);border:1px solid var(--ice);padding:5px 13px;border-radius:999px;}

.project{padding:22px 0;border-bottom:1px solid var(--line);}
.project:first-of-type{padding-top:0;}
.project:last-child{border-bottom:none;padding-bottom:0;}
.p-top{display:flex;align-items:baseline;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:5px;}
.p-top h3{font-size:19px;font-weight:700;letter-spacing:-.01em;}
.badge{flex:none;font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:4px 11px;border-radius:999px;background:#e4f5ec;color:var(--green);white-space:nowrap;}
.badge.live{background:var(--ice-bg);color:var(--navy);}
.p-line{font-size:13.5px;color:var(--ink-3);margin-bottom:12px;}
.p-line strong{color:var(--ink-2);font-weight:600;}
.project p{font-size:15px;color:var(--ink-2);margin-bottom:14px;max-width:72ch;white-space:pre-wrap;}
.p-grid{display:grid;grid-template-columns:auto 1fr;gap:8px 20px;font-size:14px;margin-bottom:14px;}
@media (max-width:560px){.p-grid{grid-template-columns:1fr;gap:3px 0;}.p-grid dd{margin-bottom:10px;}}
.p-grid dt{font-weight:700;color:var(--ink-3);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;padding-top:2px;white-space:nowrap;}
.p-grid dd{color:var(--ink-2);white-space:pre-wrap;}
.outcomes{list-style:none;display:flex;flex-direction:column;gap:6px;}
.outcomes li{font-size:15px;color:var(--ink-2);padding-left:20px;position:relative;}
.outcomes li::before{content:"";position:absolute;left:0;top:8px;width:7px;height:7px;border-radius:50%;background:var(--ice);border:1.5px solid var(--navy);}

.folio{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
@media (max-width:640px){.folio{grid-template-columns:1fr;}}
.folio-item{border:1px solid var(--line);border-radius:12px;overflow:hidden;transition:border-color .15s,background .15s;}
.folio-item:hover{border-color:var(--ice);background:var(--ice-bg);}
.folio-thumb{height:150px;background:var(--paper);border-bottom:1px solid var(--line);}
.folio-thumb img{width:100%;height:100%;object-fit:cover;display:block;}
.folio-body{padding:14px 18px 16px;}
.fh{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:5px;}
.folio-item h4{font-size:15.5px;font-weight:700;}
.folio-item p{font-size:13.5px;color:var(--ink-2);white-space:pre-wrap;margin-bottom:8px;}
.tag{flex:none;font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);white-space:nowrap;}
.folio-item .url{font-size:13px;color:var(--navy);font-weight:600;word-break:break-all;background:none;border:none;padding:0;font-family:inherit;cursor:pointer;text-align:left;}
.folio-thumb{position:relative;cursor:pointer;}
.lightbox{position:fixed;inset:0;z-index:100;background:rgba(17,17,17,.9);display:flex;align-items:center;justify-content:center;padding:24px;}
.lightbox img{max-width:100%;max-height:100%;border-radius:8px;display:block;}
.lightbox-close{position:absolute;top:20px;right:20px;width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.15);border:none;color:#fff;font-size:20px;cursor:pointer;}
.lightbox-nav{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.15);border:none;color:#fff;font-size:20px;cursor:pointer;}
.lightbox-prev{left:20px;}
.lightbox-next{right:20px;}
.lightbox-count{position:absolute;bottom:20px;left:0;right:0;text-align:center;color:#fff;font-size:13px;}

.side-links{display:flex;flex-direction:column;gap:2px;}
.side-links a,.side-links .row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);font-size:14px;text-decoration:none;}
.side-links a:last-child,.side-links .row:last-child{border-bottom:none;}
.side-links .k{color:var(--ink-3);font-weight:600;font-size:12.5px;white-space:nowrap;}
.side-links .v{color:var(--navy);font-weight:600;text-align:right;word-break:break-all;}
.side-links .v.empty-v{color:var(--ink-3);font-weight:500;}
.side-links a:hover .v{text-decoration:underline;}

.verify{background:#fff;border-radius:16px;padding:20px 22px;border-left:4px solid var(--ice);box-shadow:0 1px 3px rgba(30,39,97,.06);font-size:13.5px;color:var(--ink-2);margin-top:20px;}
.verify strong{color:var(--navy);}

.cta{margin-top:20px;background:linear-gradient(135deg,var(--navy),#2d3a8c);color:#fff;border-radius:16px;padding:24px;text-align:center;}
.cta h3{font-size:17px;font-weight:700;margin-bottom:6px;}
.cta p{font-size:13.5px;opacity:.85;margin-bottom:16px;}
.cta .btn{display:block;width:100%;font-family:inherit;font-size:14px;font-weight:600;padding:11px 20px;border-radius:999px;border:none;cursor:pointer;background:var(--ice);color:var(--navy);text-decoration:none;text-align:center;}
.cta .btn:hover{background:#cfe2fb;}

.foot{text-align:center;margin-top:36px;padding-top:24px;border-top:1px solid var(--line);font-size:13px;color:var(--ink-3);}
.foot .legal{margin-top:8px;font-size:12px;}

.empty{font-size:13.5px;color:var(--ink-3);}
.state{padding:80px 24px;text-align:center;font-size:14.5px;color:var(--ink-3);}
@media print{.topbar{position:static;}.top-actions{display:none;}body{background:#fff;}.card,.hero{box-shadow:none;border:1px solid var(--line);}}
</style>
</head>

    document.title = p.name + ' · UniCollab';

    var initials = (p.name || '').trim().split(/\s+/).map(function (w) { return w[0]; }).join('').slice(0, 2).toUpperCase() || '?';
    var metaParts = [p.course, p.year].filter(Boolean).join(' · ');

    var avatarHtml = p.avatarUrl
      ? '<img src="' + esc(p.avatarUrl) + '" alt="' + esc(p.name) + '">'
      : esc(initials);

    // Always show all four columns, in this fixed order, even when a
    // field hasn't been filled in yet — the label stays, the value is
    // just left blank rather than hiding the whole column.
    var memberSince = formatMonthYear(p.memberSince);
    var metaItems = [
      ['University', p.university || ''],
      ['Location', p.location || ''],
      ['Graduating', p.graduation || ''],
      ['Member since', memberSince || ''],
    ];
    var metaHtml = '<div class="meta">' + metaItems.map(function (item) {
        return '<div><strong>' + esc(item[0]) + '</strong> ' + esc(item[1]) + '</div>';
      }).join('') + '</div>';

    var bioHtml = p.bio ? '<p class="bio">' + esc(p.bio) + '</p>' : '';

    var focusText = (p.focusSkills && p.focusSkills.length) ? p.focusSkills.join(' · ') : '';
    var goalHtml = (p.roles && p.roles.length)
      ? '<div class="goal"><div><div class="lbl">Career goal</div><div class="val">' + esc(p.roles.join(' · ')) + '</div></div>'
        + (focusText ? '<div class="sub">Working towards: ' + esc(focusText) + '</div>' : '')
        + '</div>'
      : '';

    var heroHtml = ''
      + '<div class="hero"><div class="hero-top">'
      + '<div class="avatar">' + avatarHtml + '</div>'
      + '<div class="who">'
      + '<h1>' + esc(p.name) + '</h1>'
      + '<div class="roleline">'
      + (metaParts ? '<div class="role">' + esc(metaParts) + '</div>' : '')
      + (p.verified ? '<span class="verified">&#10003; Verified student</span>' : '')
      + '</div>'
      + metaHtml
      + '</div></div>'
      + bioHtml
      + goalHtml
      + '</div>';

    var firstName = (p.name || '').trim().split(/\s+/)[0] || 'this student';
    var ctaHtml = p.userId
      ? '<div class="cta"><h3>Work with ' + esc(firstName) + '</h3>'
        + '<p>Message ' + esc(firstName) + ' on UniCollab to collaborate on a project.</p>'
        + '<a class="btn" href="unicollab://profile/' + esc(p.userId) + '">Open in UniCollab</a></div>'
      : '';

    var skillsHtml = (p.skills && p.skills.length)
      ? '<div class="card"><h2>Skills</h2><div class="skill-group"><div class="chips">'
        + p.skills.map(function (s) { return '<span class="chip">' + esc(s) + '</span>'; }).join('')
        + '</div></div></div>'
      : '';

    var validLinks = (p.links || []).filter(function (l) { return l && l.url; });
    var CANONICAL_LINK_LABELS = ['Email', 'Website', 'LinkedIn', 'GitHub'];
    var usedLinks = [];
    var canonicalRowsHtml = CANONICAL_LINK_LABELS.map(function (label) {
      var match = validLinks.find(function (l) {
        return (l.label || '').trim().toLowerCase() === label.toLowerCase();
      });
      if (match) {
        usedLinks.push(match);
        var href = normalizeUrl(match.url);
        return '<a href="' + esc(href) + '" target="_blank" rel="noopener noreferrer"><span class="k">' + esc(label) + '</span><span class="v">' + esc(match.url) + '</span></a>';
      }
      return '<div class="row"><span class="k">' + esc(label) + '</span><span class="v empty-v">Not added</span></div>';
    }).join('');
    var extraLinks = validLinks.filter(function (l) { return usedLinks.indexOf(l) === -1; });
    var extraRowsHtml = extraLinks.map(function (l) {
      var href = normalizeUrl(l.url);
      return '<a href="' + esc(href) + '" target="_blank" rel="noopener noreferrer"><span class="k">' + esc(l.label || 'Link') + '</span><span class="v">' + esc(l.url) + '</span></a>';
    }).join('');
    var linksHtml = '<div class="card"><h2>Links &amp; contact</h2>'
      + '<div class="side-links">' + canonicalRowsHtml + extraRowsHtml + '</div>'
      + '</div>';

    var projectsHtml = '<div class="card"><h2>Projects</h2>'
      + (projects.length
          ? projects.map(function (proj) {
              var isCompleted = proj.status === 'completed';
              var lineBits = [];
              if (proj.role) lineBits.push('<strong>Role:</strong> ' + esc(proj.role));
              if (isCompleted && proj.completedAt) lineBits.push('<strong>Completed</strong> ' + esc(formatDayMonthYear(proj.completedAt)));
              else if (proj.createdAt) lineBits.push('<strong>Started</strong> ' + esc(formatDayMonthYear(proj.createdAt)));
              if (proj.timeline) lineBits.push('<strong>Duration</strong> ' + esc(proj.timeline));
              if (proj.teamSize) lineBits.push('<strong>Team</strong> ' + proj.teamSize + (proj.teamSize === 1 ? ' student' : ' students'));

              var detailRows = [];
              if (proj.brief) detailRows.push(['Brief', proj.brief]);
              if (proj.contribution) detailRows.push(['My contribution', proj.contribution]);
              if (proj.collaborators && proj.collaborators.length) detailRows.push(['Collaborators', proj.collaborators.join(' · ')]);
              if (proj.skills && proj.skills.length) detailRows.push(['Skills used', proj.skills.join(' · ')]);
              var gridHtml = detailRows.length
                ? '<dl class="p-grid">' + detailRows.map(function (row) {
                    return '<dt>' + esc(row[0]) + '</dt><dd>' + esc(row[1]) + '</dd>';
                  }).join('') + '</dl>'
                : '';

              var outcomesHtml = (proj.outcomes && proj.outcomes.length)
                ? '<ul class="outcomes">' + proj.outcomes.map(function (o) { return '<li>' + esc(o) + '</li>'; }).join('') + '</ul>'
                : '';

              return '<div class="project">'
                + '<div class="p-top"><h3>' + esc(proj.title) + '</h3>'
                + '<span class="badge' + (isCompleted ? '' : ' live') + '">' + (isCompleted ? 'Completed' : 'In progress') + '</span></div>'
                + (lineBits.length ? '<div class="p-line">' + lineBits.join(' · ') + '</div>' : '')
                + (proj.description ? '<p>' + esc(proj.description) + '</p>' : '')
                + gridHtml
                + outcomesHtml
                + '</div>';
            }).join('')
          : '<p class="empty">No posted projects yet.</p>')
      + '</div>';

    window.portfolioGalleries = portfolio.map(function (item) { return item.images || []; });

    function hostLabel(url) {
      try {
        var host = new URL(/^https?:\/\//i.test(url) ? url : 'https://' + url).hostname;
        return host.replace(/^www\./, '');
      } catch (_) { return url; }
    }

    var portfolioHtml = '<div class="card"><h2>Portfolio</h2>'
      + (portfolio.length
          ? '<div class="folio">' + portfolio.map(function (item, idx) {
              var images = item.images || [];
              var cover = images[0];
              var isPdf = /\.pdf($|\?)/i.test(item.externalUrl || '');
              var tag = item.externalUrl
                ? (isPdf ? 'PDF' : 'Link')
                : (images.length ? images.length + (images.length === 1 ? ' piece' : ' pieces') : '');
              var urlRowHtml = item.externalUrl
                ? '<a class="url" href="' + esc(normalizeUrl(item.externalUrl)) + '" target="_blank" rel="noopener noreferrer">' + esc(hostLabel(item.externalUrl)) + ' &rarr;</a>'
                : (images.length ? '<button type="button" class="url" onclick="openLightbox(' + idx + ')">View pieces &rarr;</button>' : '');
              return '<div class="folio-item">'
                + '<div class="folio-thumb"' + (images.length ? ' onclick="openLightbox(' + idx + ')"' : '') + '>' + (cover ? '<img src="' + esc(cover) + '" alt="' + esc(item.title) + '">' : '') + '</div>'
                + '<div class="folio-body">'
                + '<div class="fh"><h4>' + esc(item.title) + '</h4>' + (tag ? '<span class="tag">' + esc(tag) + '</span>' : '') + '</div>'
                + (item.subtitle ? '<p>' + esc(item.subtitle) + '</p>' : '')
                + urlRowHtml
                + '</div></div>';
            }).join('') + '</div>'
          : '<p class="empty">No public portfolio pieces yet.</p>')
      + '</div>';

    var verifyHtml = p.verified
      ? '<div class="verify"><strong>Verified by UniCollab.</strong> This student’s account email has been confirmed.</div>'
      : '';

    var colsHtml = '<div class="cols">'
      + '<div class="main">' + skillsHtml + projectsHtml + portfolioHtml + '</div>'
      + '<div class="side">' + linksHtml + ctaHtml + verifyHtml + '</div>'
      + '</div>';

    var shareUrl = location.origin + location.pathname + '?u=' + encodeURIComponent(p.userId);
    var footHtml = '<div class="foot"><div>' + esc(shareUrl) + '</div><div class="legal">Copyright © ' + new Date().getFullYear() + ' UniCollab. All rights reserved.</div></div>';

    document.getElementById('app').innerHTML = heroHtml + colsHtml + footHtml;
  }

  var shareBtn = document.getElementById('shareBtn');
  if (shareBtn) {
    shareBtn.addEventListener('click', function () {
      var shareData = { title: document.title, url: location.href };
      if (navigator.share) {
        navigator.share(shareData).catch(function () {});
      } else if (navigator.clipboard) {
        navigator.clipboard.writeText(location.href).then(function () {
          var original = shareBtn.textContent;
          shareBtn.textContent = 'Link copied';
          setTimeout(function () { shareBtn.textContent = original; }, 1600);
        }).catch(function () {});
      }
    });
  }

  var lightboxIndex = 0;
  var lightboxItem = -1;

  function renderLightbox() {
    var box = document.getElementById('lightbox');
    var images = window.portfolioGalleries[lightboxItem] || [];
    if (!box || !images.length) return;
    box.innerHTML = '<button type="button" class="lightbox-close" onclick="closeLightbox()">&times;</button>'
      + (images.length > 1 ? '<button type="button" class="lightbox-nav lightbox-prev" onclick="lightboxStep(-1)">&larr;</button>' : '')
      + '<img src="' + esc(images[lightboxIndex]) + '">'
      + (images.length > 1 ? '<button type="button" class="lightbox-nav lightbox-next" onclick="lightboxStep(1)">&rarr;</button>' : '')
      + (images.length > 1 ? '<div class="lightbox-count">' + (lightboxIndex + 1) + ' / ' + images.length + '</div>' : '');
  }

  window.openLightbox = function (itemIdx) {
    lightboxItem = itemIdx;
    lightboxIndex = 0;
    var box = document.getElementById('lightbox');
    if (box) { box.hidden = false; renderLightbox(); }
  };
  window.closeLightbox = function () {
    var box = document.getElementById('lightbox');
    if (box) box.hidden = true;
    lightboxItem = -1;
  };
  window.lightboxStep = function (dir) {
    var images = window.portfolioGalleries[lightboxItem] || [];
    if (!images.length) return;
    lightboxIndex = (lightboxIndex + dir + images.length) % images.length;
    renderLightbox();
  };

  var userId = new URLSearchParams(location.search).get('u');
  if (!userId) {
    setState('Missing profile link — check the link and try again.');
  } else {
    fetch(FUNCTION_URL + '?u=' + encodeURIComponent(userId) + '&_=' + Date.now(), { cache: 'no-store' })
      .then(function (res) { return res.json().then(function (data) { return { ok: res.ok, data: data }; }); })
      .then(function (result) {
        if (!result.ok || !result.data || !result.data.success) {
          setState("This profile isn't available.");
          return;
        }
        render(result.data);
      })
      .catch(function () {
        setState("Couldn't load this profile — check your connection and try again.");
      });
  }
</script>
</body>
</html>
