<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Confirm your UniCollab account</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f2f2f7; color: #111; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 24px; box-sizing: border-box; }
  .card { background: #fff; border-radius: 16px; padding: 32px; max-width: 420px; width: 100%; text-align: center; box-shadow: 0 1px 3px rgba(30,39,97,.08); }
  h1 { font-size: 18px; margin: 0 0 12px; }
  h1.error { color: #c0392b; }
  p { font-size: 14px; color: #4a4a4f; line-height: 1.6; margin: 0 0 20px; }
  a, button { display: inline-block; background: #1E2761; color: #fff; text-decoration: none; padding: 12px 24px; border-radius: 999px; font-weight: 600; font-size: 14px; border: none; font-family: inherit; }
  .check { font-size: 40px; margin-bottom: 12px; }
  .hint { font-size: 12px; color: #8a8a8f; margin-top: 16px; display: none; }
  .hint.show { display: block; }
</style>
</head>
<body>
  <div class="card">
    <div id="content">
      <h1 id="heading">Confirming your account…</h1>
      <p id="message">One moment.</p>
    </div>
  </div>
  <script>
    // The actual verification call happens here, in the background, via
    // fetch() — the browser's address bar stays on THIS page's own domain
    // the whole time and never navigates to supabase.co. Only the final
    // "Open UniCollab" tap ever leaves this page, and only to hand off to
    // the app via its custom URL scheme.
    var params = new URLSearchParams(window.location.search);
    var tokenHash = params.get('token_hash');
    var type = params.get('type') || 'signup';
    var projectRef = 'vqkhzpydmltzwtanvrkp';

    var headingEl = document.getElementById('heading');
    var messageEl = document.getElementById('message');
    var contentEl = document.getElementById('content');

    function showError(msg) {
      headingEl.textContent = 'Verification failed';
      headingEl.className = 'error';
      messageEl.textContent = msg;
    }

    function showSuccess() {
      contentEl.innerHTML =
        '<div class="check">&#10003;</div>' +
        '<h1>Verification completed</h1>' +
        '<p>Your email is confirmed. Go back to the UniCollab app and tap "I’m verified" to continue your registration.</p>';
    }

    if (!tokenHash) {
      showError('This link is missing required information. Please request a new verification email from the app.');
    } else {
      var apiUrl = 'https://' + projectRef + '.supabase.co/functions/v1/verify-email?token_hash=' + encodeURIComponent(tokenHash) + '&type=' + encodeURIComponent(type);
      fetch(apiUrl)
        .then(function (res) { return res.json(); })
        .then(function (data) {
          if (data.ok) {
            showSuccess();
          } else {
            showError(data.message || 'This link is invalid or has expired. Please request a new verification email from the app.');
          }
        })
        .catch(function () {
          showError('Something went wrong verifying your account. Please try again from the app.');
        });
    }
  </script>
</body>
</html>
